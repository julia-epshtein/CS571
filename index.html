<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>California Sentencing by County</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/pie-chart.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/bar-chart.css" />
    <link rel="stylesheet" href="css/header.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
  </head>
  <body>
    <div class="dashboard">
      <h1>California Sentencing by County</h1>
      <div id="map-container">
        <div id="map"></div>
      </div>
      <div id="legend-container"></div>
      <div id="county-details">
        <h3>Click on a county to see details</h3>
      </div>
    </div>
    <div class="dashboard">
      <div class="pie-charts-container">
        <div class="pie-chart-wrapper">
          <h2>Inmate Ethnicity Distribution</h2>
          <div class="chart-container">  
            <div id="pie-chart"></div>
          </div>
          <div id="legend"></div>
        </div>
        <div class="pie-chart-wrapper">
          <h2>Sentence Type Distribution</h2>
          <div class="chart-container"> 
            <div id="sentence-pie-chart"></div>
          </div>
          <div id="sentence-legend"></div>
        </div>
      </div>
      <div id="summary"></div>
    </div>
    <div class="dashboard">
      <h1>Sentence Length Distribution by Strike Type</h1>
      <div id="bar-chart"></div>
    </div>
    <script src="js/header.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pie-chart.js"></script>
    <script src="js/sentence-pie-chart.js"></script>
    <script src="js/map.js"></script>
    <script src="js/bar-chart.js"></script>
  </body>
</html>
